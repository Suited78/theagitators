<!doctype html>
<!--
  The Agitators — holding page.
  Deployed as its own Vercel project (Root Directory: holding). Plain HTML and
  CSS with no build step. Follows Brand Guidelines v1.1: Manrope, aubergine /
  purple / mint / paper, logo artwork used untouched.
-->
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Agitators</title>
    <meta
      name="description"
      content="The Agitators help organisations redesign how they work, with AI as the lever, not the point."
    />
    <meta name="theme-color" content="#faf8f3" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Agitators" />
    <meta property="og:title" content="The Agitators" />
    <meta
      property="og:description"
      content="Start with the work. Build capability that lasts. Our website is on its way."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Manrope, self-hosted (SIL Open Font License 1.1): variable, 200–800. */
      @font-face {
        font-family: Manrope;
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url("/manrope-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: Manrope;
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url("/manrope-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      :root {
        --aubergine: #2d163b;
        --purple: #7b319b;
        --mint: #bee8cc;
        --paper: #faf8f3;
        --muted: #625469;
        --gutter: clamp(1.25rem, 5vw, 4rem);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background: var(--paper);
        color: var(--aubergine);
        font-family: Manrope, Arial, system-ui, sans-serif;
        font-size: 1.125rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 3px;
        border-radius: 2px;
      }

      .layout {
        display: grid;
        min-height: 100svh;
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 3rem;
        padding: clamp(1.5rem, 4vw, 3rem) var(--gutter);
      }

      /* Guidelines: full horizontal lockup at least 180px wide. */
      .logo {
        display: block;
        width: 196px;
        height: auto;
      }

      .message {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 38rem;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 0;
        color: var(--purple);
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .motif {
        display: flex;
        gap: 0.25rem;
      }

      .motif span {
        width: 1.75rem;
        height: 0.375rem;
      }

      h1 {
        margin: 1.25rem 0 0;
        font-size: clamp(2.5rem, 5.4vw, 4.5rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }

      .lede {
        margin: 1.5rem 0 0;
        max-width: 34em;
        color: var(--muted);
        font-size: clamp(1.125rem, 1.5vw, 1.3125rem);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem 1.5rem;
        margin-top: 2.25rem;
      }

      /* Guidelines: white on purple, hover aubergine, at least 48px tall. */
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 3rem;
        padding: 0 1.5rem;
        border-radius: 6px;
        background: var(--purple);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.25s;
      }

      .btn:hover {
        background: var(--aubergine);
      }

      .email {
        color: var(--aubergine);
        font-size: 1rem;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 0.25em;
      }

      .email:hover {
        text-decoration-thickness: 2px;
      }

      footer {
        color: var(--muted);
        font-size: 0.875rem;
      }

      footer p {
        margin: 0;
      }

      /* The cover motif: the reversed symbol, cropped, on aubergine. */
      .panel {
        position: relative;
        min-height: 16rem;
        overflow: hidden;
        background: var(--aubergine);
      }

      .panel img {
        position: absolute;
        right: -14%;
        bottom: -10%;
        width: 88%;
        max-width: 42rem;
        height: auto;
      }

      @media (min-width: 60rem) {
        .layout {
          grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        }

        .panel {
          min-height: 100svh;
        }

        .panel img {
          width: 118%;
          max-width: none;
          right: -24%;
          bottom: -6%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <div class="content">
        <header>
          <img class="logo" src="/logo.svg" alt="The Agitators" width="627" height="137" />
        </header>

        <div class="message">
          <p class="label">
            <span class="motif" aria-hidden="true">
              <span style="background: var(--aubergine)"></span>
              <span style="background: var(--purple)"></span>
              <span style="background: var(--mint)"></span>
            </span>
            Website on its way
          </p>
          <h1>Start with the work. Build capability that lasts.</h1>
          <p class="lede">
            We help organisations redesign how they work, with AI as the lever, not the point. Our
            full site is on its way. In the meantime, we’d be glad to hear from you.
          </p>
          <div class="actions">
            <a class="btn" href="mailto:info@theagitators.com.au">Start a conversation</a>
            <a class="email" href="mailto:info@theagitators.com.au">info@theagitators.com.au</a>
          </div>
        </div>

        <footer>
          <p>© 2026 The Agitators</p>
        </footer>
      </div>

      <div class="panel" aria-hidden="true">
        <img src="/symbol-reversed.svg" alt="" width="185" height="137" />
      </div>
    </main>
  </body>
</html>
